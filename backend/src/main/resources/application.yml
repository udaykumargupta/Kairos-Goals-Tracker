server:
  port: ${PORT:8080}
  # Behind a platform proxy (Render/Railway), trust X-Forwarded-* so the app sees its
  # real public scheme/host. Without this, Spring misjudges its own origin and same-origin
  # API calls get wrongly treated as cross-origin and blocked by CORS (403 on sign-in).
  forward-headers-strategy: framework

spring:
  application:
    name: kairos
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kairos}
    username: ${DB_USERNAME:kairos}
    password: ${DB_PASSWORD:kairos}
  jpa:
    hibernate:
      # Auto-creates/updates tables from the entities. Fine for a personal app;
      # switch to Flyway/Liquibase migrations if this ever goes multi-user/production.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  # Email for password-reset links. Leave MAIL_HOST unset in dev and the reset link is
  # logged instead of sent. For Gmail: MAIL_HOST=smtp.gmail.com, MAIL_PORT=587,
  # MAIL_USERNAME=<your gmail>, MAIL_PASSWORD=<16-char App Password>.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

kairos:
  google:
    # OAuth 2.0 Web Client ID from Google Cloud Console. REQUIRED for login.
    client-id: ${GOOGLE_CLIENT_ID:PASTE_YOUR_GOOGLE_CLIENT_ID_HERE}
  jwt:
    # MUST be at least 32 characters. Override in production via the JWT_SECRET env var.
    secret: ${JWT_SECRET:kairos-dev-secret-change-me-please-0123456789}
    # 7 days, in milliseconds.
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}
  mail:
    # "From" address on reset emails (usually the same as MAIL_USERNAME for Gmail).
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    # Sender display name shown to recipients (independent of the Gmail username).
    from-name: ${MAIL_FROM_NAME:Kairos}
  app:
    # Public base URL for links in emails; blank = derive from the incoming request.
    base-url: ${APP_BASE_URL:}

logging:
  level:
    org.hibernate.SQL: warn
